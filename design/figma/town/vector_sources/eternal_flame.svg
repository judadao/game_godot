<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720">
  <title>Eternal Flame Guardian Monument</title>
  <desc>Editable pixel-fantasy vector monument for the Town map. All major elements are separated into named groups.</desc>
  <defs>
    <linearGradient id="stoneFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#756957"/>
      <stop offset="1" stop-color="#3d372f"/>
    </linearGradient>
    <linearGradient id="stoneTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aea087"/>
      <stop offset="1" stop-color="#665d50"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd06a"/>
      <stop offset=".28" stop-color="#c97823"/>
      <stop offset=".7" stop-color="#713614"/>
      <stop offset="1" stop-color="#2c190f"/>
    </linearGradient>
    <linearGradient id="flameOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e33b0d"/>
      <stop offset=".5" stop-color="#ff8d12"/>
      <stop offset="1" stop-color="#ffcf43"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6b09"/>
      <stop offset=".58" stop-color="#ffe564"/>
      <stop offset="1" stop-color="#fff5bd"/>
    </linearGradient>
    <radialGradient id="fireGlow">
      <stop offset="0" stop-color="#ffbd36" stop-opacity=".72"/>
      <stop offset=".52" stop-color="#ff6b13" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ff3c00" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <g id="glow" inkscape:label="Glow" opacity=".9" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
    <ellipse cx="320" cy="225" rx="205" ry="196" fill="url(#fireGlow)" filter="url(#softGlow)"/>
    <ellipse cx="320" cy="248" rx="126" ry="118" fill="#ff8a16" opacity=".14"/>
  </g>

