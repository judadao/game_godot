<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <title>Town UI Icons and Components</title>
  <desc>Editable vector source sheet for the Eternal Forge town map. Import into Figma and ungroup components as needed.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFF0A6"/>
      <stop offset=".42" stop-color="#E6A83E"/>
      <stop offset="1" stop-color="#8B4C18"/>
    </linearGradient>
    <linearGradient id="darkWood" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4C2A1B"/>
      <stop offset=".5" stop-color="#241512"/>
      <stop offset="1" stop-color="#100B0B"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9DA7B1"/>
      <stop offset=".5" stop-color="#4E5865"/>
      <stop offset="1" stop-color="#202630"/>
    </linearGradient>
    <linearGradient id="fireOrb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF26B"/>
      <stop offset=".45" stop-color="#FF8B22"/>
      <stop offset="1" stop-color="#B51F14"/>
    </linearGradient>
    <linearGradient id="iceOrb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F4FFFF"/>
      <stop offset=".45" stop-color="#65D9FF"/>
      <stop offset="1" stop-color="#2369D8"/>
    </linearGradient>
    <linearGradient id="stormOrb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF7A3"/>
      <stop offset=".4" stop-color="#B77CFF"/>
      <stop offset="1" stop-color="#4D2DA3"/>
    </linearGradient>
    <linearGradient id="venomOrb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E5FF83"/>
      <stop offset=".48" stop-color="#54C94E"/>
      <stop offset="1" stop-color="#176331"/>
    </linearGradient>
    <linearGradient id="healOrb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF9F6"/>
      <stop offset=".44" stop-color="#FF8FAE"/>
      <stop offset="1" stop-color="#A72E62"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#090505" flood-opacity=".65"/>
    </filter>
    <style>
      .label { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #FFE8A0; font-weight: 700; letter-spacing: 2px; }
      .caption { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #D8C9B4; font-weight: 600; }
      .gold-stroke { stroke: #E7A945; stroke-width: 5; stroke-linejoin: round; }
      .ink-stroke { stroke: #171217; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#17131B"/>
  <text x="54" y="48" class="label" font-size="24">鐵匠之城 · TOWN VECTOR COMPONENTS</text>

  <!-- Forge City Crest -->
  <g id="component-forge-city-crest" transform="translate(52 82)" filter="url(#smallShadow)">
    <title>Forge City Crest</title>
    <path d="M100 0 184 30v74c0 67-37 112-84 137-47-25-84-70-84-137V30L100 0Z" fill="#331B18" stroke="url(#gold)" stroke-width="8"/>
    <path d="m100 14 69 25v64c0 54-27 92-69 118-42-26-69-64-69-118V39l69-25Z" fill="#721E20" stroke="#A86127" stroke-width="3"/>
    <path d="M70 72h60l-10 20H80L70 72Z" fill="url(#iron)" class="ink-stroke"/>
    <path d="M93 92h14v51H93z" fill="url(#iron)" class="ink-stroke"/>
    <path d="m78 143 22-19 22 19-10 44H88l-10-44Z" fill="url(#gold)" class="ink-stroke"/>
    <path d="M100 47c17 18 21 32 8 42 2-13-6-18-9-28-12 12-17 24-7 34-25-10-23-31 8-48Z" fill="#FFB42B" stroke="#7E1A12" stroke-width="4"/>
    <path d="M58 122 31 97M142 122l27-25" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="100" cy="174" r="8" fill="#FFF3A1"/>
  </g>
  <text x="82" y="348" class="caption" font-size="18">Forge City Crest</text>

  <!-- Location plaques -->
  <g id="component-location-plaques" transform="translate(282 82)">
    <title>Location Plaques</title>
    <g id="plaque-large">
      <path d="M18 12h330l18 18-18 64H18L0 76V30L18 12Z" fill="url(#darkWood)" class="gold-stroke" filter="url(#smallShadow)"/>
      <path d="M22 24h322l8 10-12 46H23L12 70V35l10-11Z" stroke="#70441F" stroke-width="3"/>
      <circle cx="24" cy="53" r="7" fill="url(#gold)"/><circle cx="338" cy="53" r="7" fill="url(#gold)"/>
      <text x="181" y="64" text-anchor="middle" class="label" font-size="26">鐵匠之城</text>
    </g>
    <g id="plaque-medium" transform="translate(0 120)">
      <path d="M15 8h270l15 15-15 50H15L0 59V23L15 8Z" fill="url(#darkWood)" class="gold-stroke"/>
      <circle cx="22" cy="41" r="6" fill="url(#gold)"/><circle cx="278" cy="41" r="6" fill="url(#gold)"/>
      <text x="150" y="51" text-anchor="middle" class="label" font-size="22">不滅火炬</text>
    </g>
    <g id="plaque-small" transform="translate(0 218)">
      <path d="M12 6h200l12 12-12 41H12L0 48V18L12 6Z" fill="url(#darkWood)" class="gold-stroke"/>
      <text x="112" y="42" text-anchor="middle" class="label" font-size="18">戰鬥傳送門</text>
    </g>
  </g>

  <!-- Shop / location pictograms -->
  <g id="component-location-icons" transform="translate(690 90)">
    <title>Location and Shop Icons</title>
    <g id="icon-material" transform="translate(0 0)">
      <circle cx="55" cy="55" r="51" fill="#251A1B" stroke="url(#gold)" stroke-width="6"/>
      <path d="m18 73 18-33 29-12 17 22 10 34H30L18 73Z" fill="#777A7D" stroke="#171217" stroke-width="5"/>
      <path d="m36 40 13 15 16-27 17 22-20 9-13-4-19 20" stroke="#B8C0C6" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="82" cy="74" r="9" fill="#A86532"/>
    </g>
    <g id="icon-anvil" transform="translate(135 0)">
      <circle cx="55" cy="55" r="51" fill="#251A1B" stroke="url(#gold)" stroke-width="6"/>
      <path d="M17 35h74c6 0 10 6 7 11L86 62H55v15h24l8 19H27l8-19h13V61c-17-3-28-11-31-26Z" fill="url(#iron)" stroke="#111217" stroke-width="6" stroke-linejoin="round"/>
      <path d="M36 31 68 9l9 10-32 22-9-10Z" fill="#B56F2F" stroke="#171217" stroke-width="5"/>
    </g>
    <g id="icon-mayor" transform="translate(270 0)">
      <circle cx="55" cy="55" r="51" fill="#251A1B" stroke="url(#gold)" stroke-width="6"/>
      <path d="M24 82h62V45L55 22 24 45v37Z" fill="#7B2630" stroke="#171217" stroke-width="6"/>
      <path d="M18 86h74M31 45h48M35 45v37M55 45v37M75 45v37" stroke="#F0BC55" stroke-width="6" stroke-linecap="round"/>
      <path d="m42 18 13-10 13 10" stroke="#F0BC55" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g id="icon-sword-soul" transform="translate(405 0)">
      <circle cx="55" cy="55" r="51" fill="#251A1B" stroke="url(#gold)" stroke-width="6"/>
      <circle cx="55" cy="51" r="25" fill="#7E3BC4" opacity=".35" filter="url(#softGlow)"/>
      <path d="M55 12c18 11 26 26 20 41-3 7-9 12-16 14 2-7-1-13-7-19-3 11-10 16-19 17-7-21 2-39 22-53Z" fill="url(#stormOrb)" stroke="#D7B8FF" stroke-width="4"/>
      <path d="m35 86 40-40M43 91l-9-9m40-40 8 8" stroke="#D8DDE8" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g id="icon-portal" transform="translate(540 0)">
      <circle cx="55" cy="55" r="51" fill="#251A1B" stroke="url(#gold)" stroke-width="6"/>
      <path d="M22 91V49C22 27 37 14 55 14s33 13 33 35v42" stroke="#AFA18B" stroke-width="10"/>
      <path d="M30 88V51c0-17 11-27 25-27s25 10 25 27v37H30Z" fill="#193C88"/>
      <path d="M38 69c3-20 28-26 37-10 7 13-4 24-16 21-10-2-12-14-4-18 6-4 12 3 7 8" stroke="#66E2FF" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="55" y="132" text-anchor="middle" class="caption" font-size="16">材料</text>
    <text x="190" y="132" text-anchor="middle" class="caption" font-size="16">鐵匠鋪</text>
    <text x="325" y="132" text-anchor="middle" class="caption" font-size="16">村長家</text>
    <text x="460" y="132" text-anchor="middle" class="caption" font-size="16">劍魂商</text>
    <text x="595" y="132" text-anchor="middle" class="caption" font-size="16">傳送門</text>
  </g>

  <!-- Sword Soul orbs -->
  <g id="component-sword-soul-orbs" transform="translate(54 405)">
    <title>Five Sword Soul Orbs</title>
    <g id="sword-soul-fire">
      <circle cx="68" cy="68" r="57" fill="#5A1B17" opacity=".65" filter="url(#softGlow)"/>
      <circle cx="68" cy="68" r="52" fill="url(#fireOrb)" stroke="#FFD36A" stroke-width="6"/>
      <path d="M69 28c17 22 21 37 8 48 2-13-6-19-9-29-17 17-20 34-6 47-24-2-35-20-24-39 7-13 20-19 31-27Z" fill="#FFF080" stroke="#B33218" stroke-width="4"/>
      <path d="M29 70c7 26 27 38 52 36M95 47c11 11 15 25 9 39" stroke="#FFF4AF" stroke-width="4" stroke-linecap="round" opacity=".8"/>
      <text x="68" y="150" text-anchor="middle" class="caption" font-size="17">火焰劍魂</text>
    </g>
    <g id="sword-soul-ice" transform="translate(174 0)">
      <circle cx="68" cy="68" r="57" fill="#146F9D" opacity=".65" filter="url(#softGlow)"/>
      <circle cx="68" cy="68" r="52" fill="url(#iceOrb)" stroke="#C5FAFF" stroke-width="6"/>
      <path d="M68 25v86M31 47l74 42M31 89l74-42M68 25 57 38m11-13 11-13M31 47l16 1m-6-16 6 16m58-1-16 1m6-16-6 16M31 89l16-1m-6 16 6-16m58 1-16-1m6 16-6-16m-21 23-11-13m11-10 11 13" stroke="#ECFFFF" stroke-width="5" stroke-linecap="round"/>
      <text x="68" y="150" text-anchor="middle" class="caption" font-size="17">寒冰劍魂</text>
    </g>
    <g id="sword-soul-storm" transform="translate(348 0)">
      <circle cx="68" cy="68" r="57" fill="#5B3990" opacity=".7" filter="url(#softGlow)"/>
      <circle cx="68" cy="68" r="52" fill="url(#stormOrb)" stroke="#E8D2FF" stroke-width="6"/>
      <path d="M74 22 41 70h22l-9 44 40-58H72l2-34Z" fill="#FFF48D" stroke="#5A2B95" stroke-width="5" stroke-linejoin="round"/>
      <path d="M28 48c8-10 17-14 28-14M94 91c-8 10-17 14-28 14" stroke="#F4DAFF" stroke-width="4" stroke-linecap="round"/>
      <text x="68" y="150" text-anchor="middle" class="caption" font-size="17">風暴劍魂</text>
    </g>
    <g id="sword-soul-venom" transform="translate(522 0)">
      <circle cx="68" cy="68" r="57" fill="#286828" opacity=".65" filter="url(#softGlow)"/>
      <circle cx="68" cy="68" r="52" fill="url(#venomOrb)" stroke="#C8F47A" stroke-width="6"/>
      <path d="M44 39c16-13 39-6 43 14 4 18-8 35-19 48-7-13-26-26-28-42-1-8 0-14 4-20Z" fill="#A9EE65" stroke="#175A2E" stroke-width="5"/>
      <path d="M69 98c-8-23-5-39 10-50M61 67c-5-7-11-10-18-11m27 21c6-7 13-10 21-9" stroke="#E9FFB6" stroke-width="4" stroke-linecap="round"/>
      <circle cx="34" cy="93" r="7" fill="#D8FF7A"/><circle cx="97" cy="39" r="5" fill="#D8FF7A"/>
      <text x="68" y="150" text-anchor="middle" class="caption" font-size="17">劇毒劍魂</text>
    </g>
    <g id="sword-soul-healing" transform="translate(696 0)">
      <circle cx="68" cy="68" r="57" fill="#8A305A" opacity=".62" filter="url(#softGlow)"/>
      <circle cx="68" cy="68" r="52" fill="url(#healOrb)" stroke="#FFE0EA" stroke-width="6"/>
      <path d="M68 103S30 82 30 54c0-16 20-26 38-6 18-20 38-10 38 6 0 28-38 49-38 49Z" fill="#FFF3F6" stroke="#A72E62" stroke-width="5"/>
      <path d="M68 58v30M53 73h30" stroke="#E34E7D" stroke-width="8" stroke-linecap="round"/>
      <text x="68" y="150" text-anchor="middle" class="caption" font-size="17">治癒劍魂</text>
    </g>
  </g>

  <!-- Banners -->
  <g id="component-town-banners" transform="translate(1022 269)">
    <title>Town Banner Set</title>
    <g id="banner-red">
      <path d="M15 0h112v194l-56-31-56 31V0Z" fill="#762027" stroke="url(#gold)" stroke-width="6"/>
      <path d="M26 12h90v153l-45-23-45 23V12Z" stroke="#A94A31" stroke-width="3"/>
      <path d="M48 61h46l-8 15H56l-8-15Zm17 15h12v42H65V76Zm-10 42h32l-6 23H61l-6-23Z" fill="url(#gold)"/>
    </g>
    <g id="banner-blue" transform="translate(154 0)">
      <path d="M15 0h112v194l-56-31-56 31V0Z" fill="#1F4A7A" stroke="url(#gold)" stroke-width="6"/>
      <path d="M26 12h90v153l-45-23-45 23V12Z" stroke="#346EA5" stroke-width="3"/>
      <path d="M71 39c17 0 30 13 30 30 0 20-17 35-30 51-13-16-30-31-30-51 0-17 13-30 30-30Z" fill="#79DBFF" stroke="#F1E7A4" stroke-width="4"/>
      <path d="M55 72c10-15 27-15 35-2-5 15-17 25-19 36-4-13-15-19-16-34Z" fill="#263F9A"/>
    </g>
    <g id="banner-gold" transform="translate(308 0)">
      <path d="M15 0h112v194l-56-31-56 31V0Z" fill="#9B611D" stroke="#FFE49A" stroke-width="6"/>
      <path d="M26 12h90v153l-45-23-45 23V12Z" stroke="#D39B3D" stroke-width="3"/>
      <path d="m71 39 12 22 25 4-18 18 4 26-23-12-23 12 4-26-18-18 25-4 12-22Z" fill="#FFF1A8" stroke="#8B4C18" stroke-width="4"/>
    </g>
  </g>

  <!-- Portal loadout card UI -->
  <g id="component-portal-loadout-card" transform="translate(54 640)" filter="url(#smallShadow)">
    <title>Portal Loadout Card UI</title>
    <path d="M18 0h892l18 18v276l-18 18H18L0 294V18L18 0Z" fill="#100D15" stroke="url(#gold)" stroke-width="6"/>
    <path d="M26 18h876l8 8v260l-8 8H26l-8-8V26l8-8Z" fill="#1B1424" stroke="#64412D" stroke-width="3"/>
    <text x="38" y="53" class="label" font-size="24">傳送門出征配置</text>
    <text x="38" y="82" class="caption" font-size="15">選擇 3 張劍魂與 1 張治癒牌，進入戰鬥後固定保留。</text>
    <g id="slot-combo-1" transform="translate(38 105)">
      <rect width="142" height="160" rx="12" fill="#281C36" stroke="#A670E6" stroke-width="4"/>
      <circle cx="71" cy="61" r="30" fill="url(#fireOrb)" stroke="#FFD36A" stroke-width="4"/>
      <text x="71" y="116" text-anchor="middle" class="label" font-size="17">劍魂 1</text>
      <text x="71" y="140" text-anchor="middle" class="caption" font-size="13">Q</text>
    </g>
    <g id="slot-combo-2" transform="translate(195 105)">
      <rect width="142" height="160" rx="12" fill="#281C36" stroke="#A670E6" stroke-width="4"/>
      <circle cx="71" cy="61" r="30" fill="url(#iceOrb)" stroke="#C5FAFF" stroke-width="4"/>
      <text x="71" y="116" text-anchor="middle" class="label" font-size="17">劍魂 2</text>
      <text x="71" y="140" text-anchor="middle" class="caption" font-size="13">W</text>
    </g>
    <g id="slot-combo-3" transform="translate(352 105)">
      <rect width="142" height="160" rx="12" fill="#281C36" stroke="#A670E6" stroke-width="4"/>
      <circle cx="71" cy="61" r="30" fill="url(#stormOrb)" stroke="#E8D2FF" stroke-width="4"/>
      <text x="71" y="116" text-anchor="middle" class="label" font-size="17">劍魂 3</text>
      <text x="71" y="140" text-anchor="middle" class="caption" font-size="13">E</text>
    </g>
    <g id="slot-healing" transform="translate(509 105)">
      <rect width="142" height="160" rx="12" fill="#36202D" stroke="#FF8FAE" stroke-width="4"/>
      <circle cx="71" cy="61" r="30" fill="url(#healOrb)" stroke="#FFE0EA" stroke-width="4"/>
      <path d="M71 43v36M53 61h36" stroke="#FFF" stroke-width="8" stroke-linecap="round"/>
      <text x="71" y="116" text-anchor="middle" class="label" font-size="17">治癒牌</text>
      <text x="71" y="140" text-anchor="middle" class="caption" font-size="13">R</text>
    </g>
    <g id="portal-action-button" transform="translate(687 118)">
      <rect width="190" height="72" rx="10" fill="#5B2E1C" stroke="url(#gold)" stroke-width="5"/>
      <text x="95" y="45" text-anchor="middle" class="label" font-size="22">確認配置</text>
    </g>
    <g id="portal-power-summary" transform="translate(687 205)">
      <rect width="190" height="48" rx="8" fill="#171D2E" stroke="#557BD0" stroke-width="3"/>
      <text x="95" y="31" text-anchor="middle" class="caption" font-size="15">終結技：千刃殺</text>
    </g>
  </g>

  <g id="sheet-notes" transform="translate(1020 690)">
    <text class="label" font-size="21">FIGMA 使用方式</text>
    <text y="34" class="caption" font-size="15">• 每個 component-* 群組可獨立轉成 Component</text>
    <text y="59" class="caption" font-size="15">• 顏色、描邊、文字與圖形皆為原生 SVG 向量</text>
    <text y="84" class="caption" font-size="15">• 劍魂球可作為武器效果、卡牌與終結技前綴</text>
    <text y="109" class="caption" font-size="15">• 建議保留 8px grid，牌位間距 15px</text>
    <rect y="137" width="490" height="116" rx="10" fill="#211923" stroke="#5F4737" stroke-width="3"/>
    <text x="20" y="168" class="label" font-size="18">命名公式</text>
    <text x="20" y="199" class="caption" font-size="16">神賜效果 + 終結技效果 + Combo 組合效果</text>
    <text x="20" y="228" class="caption" font-size="16">例：絕對零度的千刃殺</text>
  </g>
</svg>
