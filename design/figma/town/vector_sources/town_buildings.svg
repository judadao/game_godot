<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="720" viewBox="0 0 2400 720" fill="none">
  <title>Town Buildings — Editable Vector Source</title>
  <desc>Six grouped pixel-fantasy town facades. All signs are intentionally blank and every building is an editable named SVG group.</desc>
  <defs>
    <linearGradient id="bg" x1="1200" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172131"/>
      <stop offset="1" stop-color="#0D121B"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#59616B"/>
      <stop offset="1" stop-color="#303640"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#744927"/>
      <stop offset="1" stop-color="#3B251B"/>
    </linearGradient>
    <linearGradient id="blueRoof" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#315E85"/>
      <stop offset="1" stop-color="#18344E"/>
    </linearGradient>
    <linearGradient id="redRoof" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#954B3D"/>
      <stop offset="1" stop-color="#54272A"/>
    </linearGradient>
    <linearGradient id="purpleRoof" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#75469A"/>
      <stop offset="1" stop-color="#3B245B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFE09A"/>
      <stop offset=".45" stop-color="#D99631"/>
      <stop offset="1" stop-color="#72421A"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#FF5A19"/>
      <stop offset=".55" stop-color="#FFB020"/>
      <stop offset="1" stop-color="#FFF4A8"/>
    </linearGradient>
    <linearGradient id="soul" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#6D2CDC"/>
      <stop offset=".55" stop-color="#B34DFF"/>
      <stop offset="1" stop-color="#F1C2FF"/>
    </linearGradient>
    <filter id="fireGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soulGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="brickPattern" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="url(#stone)"/>
      <path d="M0 0H48M0 24H48M24 0V12M0 12H48M12 12V24M36 12V24" stroke="#202631" stroke-width="3"/>
      <path d="M2 3H22M26 3H46M2 15H10M14 15H34M38 15H46" stroke="#69717B" stroke-width="2" opacity=".55"/>
    </pattern>
    <pattern id="blueTiles" width="34" height="20" patternUnits="userSpaceOnUse">
      <rect width="34" height="20" fill="url(#blueRoof)"/>
      <path d="M0 1H34M0 19H34M17 1V19" stroke="#10263C" stroke-width="3"/>
      <path d="M2 4H15M19 4H32" stroke="#4B7695" stroke-width="2"/>
    </pattern>
    <pattern id="redTiles" width="34" height="20" patternUnits="userSpaceOnUse">
      <rect width="34" height="20" fill="url(#redRoof)"/>
      <path d="M0 1H34M0 19H34M17 1V19" stroke="#402029" stroke-width="3"/>
      <path d="M2 4H15M19 4H32" stroke="#B96550" stroke-width="2"/>
    </pattern>
    <pattern id="purpleTiles" width="34" height="20" patternUnits="userSpaceOnUse">
      <rect width="34" height="20" fill="url(#purpleRoof)"/>
      <path d="M0 1H34M0 19H34M17 1V19" stroke="#291B43" stroke-width="3"/>
      <path d="M2 4H15M19 4H32" stroke="#9565B5" stroke-width="2"/>
    </pattern>
  </defs>

